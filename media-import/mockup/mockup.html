<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0 }
  html, body { width: 1200px; height: 675px; overflow: hidden }
  body {
    background:
      radial-gradient(60% 70% at 62% 42%, rgba(255,119,119,.20), transparent 70%),
      radial-gradient(50% 60% at 20% 90%, rgba(255,119,119,.10), transparent 70%),
      linear-gradient(160deg, #1e1b23 0%, #16141a 55%, #0f0e12 100%);
    position: relative;
  }
  /* soft floor under the devices */
  .floor { position: absolute; left: 50%; bottom: 58px; width: 900px; height: 60px; transform: translateX(-46%);
    background: radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.55), transparent 75%); filter: blur(10px) }

  /* ---------- laptop ---------- */
  .laptop { position: absolute; left: 270px; top: 92px; width: 760px }
  .lid { position: relative; width: 760px; height: 476px; padding: 16px 16px 22px; border-radius: 22px 22px 6px 6px;
    background: linear-gradient(180deg, #2c2a30, #1a191d); box-shadow: inset 0 0 0 1.5px #3b3940, inset 0 0 0 3px #111 }
  .lid .cam { position: absolute; top: 6px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: #0b0b0d; box-shadow: 0 0 0 1px #2a2a2e }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 6px; overflow: hidden; background: #000 }
  .screen img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block }
  .glare { position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 38%); pointer-events: none }
  .base { position: relative; width: 880px; height: 20px; margin-left: -60px; border-radius: 3px 3px 16px 16px;
    background: linear-gradient(180deg, #4a484f 0%, #2d2c31 45%, #1b1a1e 100%); box-shadow: 0 18px 40px -8px rgba(0,0,0,.75) }
  .base::before { content: ""; position: absolute; top: 0; left: 50%; width: 130px; height: 8px; margin-left: -65px; border-radius: 0 0 9px 9px; background: #1f1e22 }

  /* ---------- phone ---------- */
  .phone { position: absolute; left: 150px; top: 196px; width: 190px; height: 404px; padding: 8px; border-radius: 36px;
    background: linear-gradient(145deg, #3a383f, #141317); box-shadow: inset 0 0 0 1.5px #4a4850, inset 0 0 0 3px #0c0c0e, 0 30px 60px -12px rgba(0,0,0,.8), 0 0 0 1px rgba(0,0,0,.4) }
  .phone .screen { border-radius: 29px }
  .island { position: absolute; top: 15px; left: 50%; width: 56px; height: 16px; margin-left: -28px; border-radius: 10px; background: #050506; z-index: 2 }
  .btn { position: absolute; width: 3px; border-radius: 2px; background: #2b2a2f }
</style></head>
<body>
  <div class="floor"></div>
  <div class="laptop">
    <div class="lid"><span class="cam"></span><div class="screen"><img src="laptop.jpg" alt=""><div class="glare"></div></div></div>
    <div class="base"></div>
  </div>
  <div class="phone">
    <span class="btn" style="left:-3px;top:88px;height:26px"></span>
    <span class="btn" style="left:-3px;top:126px;height:42px"></span>
    <span class="btn" style="right:-3px;top:110px;height:60px"></span>
    <span class="island"></span>
    <div class="screen"><img src="phone.jpg" alt=""><div class="glare"></div></div>
  </div>
</body></html>
