<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0 }
  html, body { width: 1200px; height: 675px; overflow: hidden }
  /* ourkitchen.co.il brand: paper cream, dark brown, red, honey tape, polaroids */
  body { background: radial-gradient(80% 70% at 55% 35%, #fdfbf7 0%, #f6f1e8 60%, #f1e9dc 100%); position: relative }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 36%; background: #2b2622 }
  .stage { position: absolute; inset: 0; transform: scale(.74); transform-origin: 50% 47% }
  .polaroid { position: absolute; background: #fffdf8; padding: 12px 12px 44px; box-shadow: 0 18px 40px -12px rgba(43,38,34,.45) }
  .polaroid img { display: block; width: 100%; height: 100%; object-fit: cover }
  .polaroid::before { content: ""; position: absolute; top: -14px; left: 50%; width: 96px; height: 28px; margin-left: -48px; background: rgba(240,217,164,.82); transform: rotate(-3deg) }
  .pa { width: 250px; height: 300px; left: 120px; top: 70px; transform: rotate(-8deg) }
  .pb { width: 240px; height: 290px; right: 70px; top: 40px; transform: rotate(7deg) }
  .dot { position: absolute; border-radius: 50%; background: #c8372d }
  .laptop { position: absolute; left: 330px; top: 120px; width: 640px }
  .lid { position: relative; width: 640px; height: 400px; padding: 13px 13px 19px; border-radius: 18px 18px 6px 6px;
    background: linear-gradient(180deg, #3a332e, #221e1b); box-shadow: inset 0 0 0 1.5px #4a423c, inset 0 0 0 3px #15120f }
  .cam { position: absolute; top: 5px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: #0b0a09 }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 6px; overflow: hidden; background: #fdfbf7 }
  .screen img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block }
  .glare { position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.12), rgba(255,255,255,0) 40%) }
  .base { position: relative; width: 740px; height: 17px; margin-left: -50px; border-radius: 3px 3px 15px 15px;
    background: linear-gradient(180deg, #5a514a 0%, #38312c 45%, #221e1b 100%); box-shadow: 0 22px 40px -10px rgba(0,0,0,.6) }
  .base::before { content: ""; position: absolute; top: 0; left: 50%; width: 110px; height: 7px; margin-left: -55px; border-radius: 0 0 8px 8px; background: #2a2521 }
  .phone { position: absolute; left: 250px; top: 230px; width: 178px; height: 380px; padding: 8px; border-radius: 34px; transform: rotate(-4deg);
    background: linear-gradient(145deg, #463e38, #1c1916); box-shadow: inset 0 0 0 1.5px #574e47, inset 0 0 0 3px #110f0d, 18px 30px 50px -12px rgba(0,0,0,.55) }
  .phone .screen { border-radius: 27px }
  .island { position: absolute; top: 15px; left: 50%; width: 52px; height: 15px; margin-left: -26px; border-radius: 9px; background: #050505; z-index: 2 }
</style></head>
<body>
  <div class="band"></div>
  <div class="stage">
    <div class="polaroid pa"><img src="photo-a.jpg" alt=""></div>
    <div class="polaroid pb"><img src="photo-b.jpg" alt=""></div>
    <span class="dot" style="width:22px;height:22px;left:520px;top:70px"></span>
    <span class="dot" style="width:12px;height:12px;right:330px;bottom:60px;background:#f0d9a4"></span>
    <div class="laptop">
      <div class="lid"><span class="cam"></span><div class="screen"><img src="laptop.png" alt=""><div class="glare"></div></div></div>
      <div class="base"></div>
    </div>
    <div class="phone"><span class="island"></span><div class="screen"><img src="phone.png" alt=""><div class="glare"></div></div></div>
  </div>
</body></html>
