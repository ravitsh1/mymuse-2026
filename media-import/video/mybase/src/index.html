<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MyBase showcase</title>
<style>
  :root { --aubergine:#1B0D2D; --ink:#17283F; --pink:#C94F86; --lime:#D8F450; --off:#F8F6F3 }
  * { box-sizing: border-box }
  html, body { margin: 0; background: var(--off) }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--off); font-family: 'Inter Display', 'Inter', sans-serif }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px) }
  #b1 { width: 620px; height: 620px; background: var(--pink); opacity: .16; left: -140px; top: 560px }
  #b2 { width: 560px; height: 560px; background: var(--lime); opacity: .34; left: 1500px; top: -180px }
  #b3 { width: 380px; height: 380px; background: var(--ink); opacity: .08; left: 1560px; top: 760px }
  #world, #bg { position: absolute; inset: 0; transform-origin: 0 0 }
  #win { position: absolute; left: 280px; top: 92px; width: 1360px; height: 896px; border-radius: 14px; background: #fff; overflow: hidden;
    box-shadow: 0 50px 90px -30px rgba(27,13,45,.30), 0 18px 36px -18px rgba(27,13,45,.18), 0 0 0 1px rgba(27,13,45,.08) }
  #bar { height: 46px; background: #fff; border-bottom: 1px solid rgba(27,13,45,.08); display: flex; align-items: center; padding: 0 18px; gap: 8px }
  #bar i { width: 12px; height: 12px; border-radius: 50% }
  #addr { margin: 0 auto; transform: translateX(-34px); width: 420px; height: 28px; border-radius: 14px; background: #F3F0EC; color: #17283F; font-size: 13px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 7px; letter-spacing: .01em }
  #view { position: relative; width: 1360px; height: 850px; overflow: hidden; background: #fff }
  #view img { position: absolute; opacity: 0; left: 0; top: 0; width: 1360px; height: 850px; display: block }
  #ripple { position: absolute; width: 0; height: 0; border-radius: 50%; border: 2px solid var(--pink); background: rgba(201,79,134,.16); opacity: 0; transform: translate(-50%,-50%) }
  #cursor { position: absolute; left: 0; top: 0; width: 26px; height: 26px; transform-origin: 0 0; opacity: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)) }
  #end { position: absolute; left: 0; right: 0; top: 812px; text-align: center; color: var(--aubergine); opacity: 0 }
  #end h1 { margin: 0; font-size: 104px; line-height: 1; font-weight: 700; letter-spacing: -.035em }
  #end h1 span { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: var(--pink); margin-left: 10px }
  #end p { margin: 26px 0 0; font-size: 22px; font-weight: 500; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 12px; letter-spacing: .02em }
  #end svg { height: 32px; width: auto; color: var(--aubergine); transform: translateY(-1px) }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"><div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div></div>
  <div id="world">
    <div id="win">
      <div id="bar">
        <i style="background:#C94F86"></i><i style="background:#D8F450"></i><i style="background:#17283F"></i>
        <div id="addr">
          <svg width="11" height="13" viewBox="0 0 11 13" fill="none"><rect x="1" y="5.5" width="9" height="6.5" rx="1.6" fill="#17283F"/><path d="M3 5.5V4a2.5 2.5 0 0 1 5 0v1.5" stroke="#17283F" stroke-width="1.4"/></svg>
          MyBase
        </div>
      </div>
      <div id="view">
        <img id="s1" src="home.webp" alt="" style="opacity:1">
        <img id="s2" src="tasks.webp" alt="">
        <img id="s3" src="finance.webp" alt="">
        <img id="s4" src="reports.webp" alt="">
        <img id="s5" src="calendar.webp" alt="">
      </div>
    </div>
    <div id="ripple"></div>
    <svg id="cursor" viewBox="0 0 26 26"><path d="M3 2 L3 21 L8.2 16.4 L11.6 24 L14.8 22.6 L11.5 15.2 L18.4 15.2 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>
  <div id="end">
    <h1>MyBase<span></span></h1>
    <p>Designed &amp; Developed by <svg id="logo" viewBox="0 0 500 159"><path fill="currentColor" fill-rule="evenodd"/></svg></p>
  </div>
</div>
<script src="logo.js"></script>
<script>
document.querySelector('#logo path').setAttribute('d', window.LOGO_WIDE)
const $ = (id) => document.getElementById(id)
const K = 1360 / 2000, OX = 280, OY = 138
const P = (sx, sy) => [OX + sx * K, OY + sy * K]
const ease = (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2)
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const ramp = (t, a, b) => ease(clamp((t - a) / (b - a)))
// keyframes: [t, ...values]; eased between neighbours
function track(keys, t) {
  if (t <= keys[0][0]) return keys[0].slice(1)
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const a = keys[i - 1], b = keys[i], p = ease((t - a[0]) / (b[0] - a[0]))
      return a.slice(1).map((v, j) => v + (b[j + 1] - v) * p)
    }
  }
  return keys[keys.length - 1].slice(1)
}
const C = (t, sx, sy, s) => [t, ...P(sx, sy), s]
// real click targets (source px): sidebar "משימות", sidebar "כספים", finance toolbar "דוחות"
const CLICKS = [
  { t: 9.5, at: [1900, 216], show: 's2' },
  { t: 14.4, at: [1905, 366], show: 's3' },
  { t: 17.0, at: [680, 491], show: 's4' },
]
const CAM = [
  [0, 960, 540, 1], [3.2, 960, 540, 1],
  C(4.8, 1080, 470, 1.18), C(6.6, 1040, 760, 1.25), C(8.0, 1000, 800, 1.25),
  [9.3, 990, 530, 1.05], [9.9, 990, 530, 1.05],
  C(11.4, 1120, 520, 1.22), C(13.0, 1100, 640, 1.22),
  [14.2, 990, 530, 1.05], [14.8, 990, 530, 1.05],
  C(16.2, 1000, 500, 1.3), C(17.3, 1000, 500, 1.3),
  [19.0, 960, 540, 1.04],
  C(20.6, 900, 590, 1.3), C(21.8, 840, 620, 1.3), C(23.8, 960, 960, 1.3),
  [25.8, 960, 679.5, .8], [28, 960, 679.5, .8],
]
const CUR = [
  [0, 1000, 640], [3.0, 1000, 640],
  [4.4, 1420, 318], [5.0, 1420, 318], [6.2, 1500, 716], [6.8, 1500, 716], [7.8, 1350, 908], [8.2, 1350, 908],
  [9.3, 1900, 216], [10.2, 1900, 216],
  [11.3, 1400, 243], [11.8, 1400, 243], [12.6, 1350, 470], [13.0, 1350, 580], [13.2, 1350, 580],
  [14.25, 1905, 366], [15.0, 1905, 366],
  [16.5, 680, 491], [17.6, 680, 491],
  [19.4, 1350, 300], [19.8, 1350, 300], [21.0, 606, 560], [21.4, 606, 560], [22.2, 938, 560], [22.6, 938, 560],
  [23.8, 610, 1078], [28, 610, 1078],
]

function apply(cam, bgK = .25) {
  const [cx, cy, s] = cam
  $('world').style.transform = `translate(${960 - cx * s}px,${540 - cy * s}px) scale(${s})`
  const bs = 1 + (s - 1) * bgK
  $('bg').style.transform = `translate(${960 - (960 + (cx - 960) * bgK) * bs}px,${540 - (540 + (cy - 540) * bgK) * bs}px) scale(${bs})`
}

window.render = (t) => {
  const cam = track(CAM, t)
  apply(cam)
  // window entrance: fade + gentle scale
  const inP = ramp(t, .35, 1.7)
  $('win').style.opacity = inP
  $('win').style.transform = `translateY(${(1 - inP) * 26}px) scale(${.955 + .045 * inP})`
  // screen changes follow the clicks
  $('s5').style.opacity = 0
  let press = 1, rip = $('ripple')
  rip.style.opacity = 0
  for (const c of CLICKS) {
    $(c.show).style.opacity = ramp(t, c.t + .12, c.t + .62)
    if (t >= c.t && t < c.t + .22) press = .86
    const rp = (t - c.t) / .6
    if (rp >= 0 && rp < 1) {
      const [x, y] = P(...c.at)
      rip.style.left = x + 'px'; rip.style.top = y + 'px'
      rip.style.width = rip.style.height = 10 + 54 * ease(rp) + 'px'
      rip.style.opacity = 1 - rp
    }
  }
  // cursor
  const [sx, sy] = track(CUR, t), [x, y] = P(sx, sy)
  const cur = $('cursor')
  cur.style.transform = `translate(${x}px,${y}px) scale(${press / cam[2]})`
  cur.style.opacity = ramp(t, 2.3, 2.8) * (1 - ramp(t, 24.0, 24.5))
  // end card
  const e = ramp(t, 25.5, 26.5)
  $('end').style.opacity = e
  $('end').style.transform = `translateY(${(1 - e) * 22}px)`
}

// seamless 7s loop: no cursor, slow drift, home <-> calendar
window.renderLoop = (t) => {
  const w = (t / 7) * Math.PI * 2
  apply([960 + 46 * Math.sin(w), 540 + 22 * Math.sin(w * 2), 1.1 + .04 * Math.cos(w)])
  $('win').style.opacity = 1; $('win').style.transform = 'none'
  for (const id of ['s2', 's3', 's4']) $(id).style.opacity = 0
  $('s5').style.opacity = ramp(t, 3.0, 3.6) * (1 - ramp(t, 6.4, 7.0))
  $('cursor').style.opacity = 0; $('ripple').style.opacity = 0; $('end').style.opacity = 0
}
window.render(0)
</script>
</body>
</html>
